name: Publicar Planilla en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos de la web
        run: |
          mkdir site
          cp index.html styles.css app.js data.js icon.svg manifest.webmanifest sw.js .nojekyll site/
          cp -R images site/
      - name: Subir la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
