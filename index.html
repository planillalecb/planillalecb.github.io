<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8c5a6">
  <meta name="description" content="Planilla de turnos TMA LECB">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>Planilla · TMA</title>
</head>
<body>
  <div class="app">
    <header class="app-bar">
      <button id="backButton" class="icon-button hidden" aria-label="Volver">←</button>
      <div class="app-title"><strong>Planilla</strong><small>TMA · LECB</small></div>
    </header>

    <main>
      <section id="homeScreen" class="screen">
        <div class="intro"><h1>Escoge tu número de planilla</h1><p>Selecciona el tipo de planilla y después tu número.</p></div>
        <div id="templateTabs" class="template-tabs" role="tablist" aria-label="Tipo de planilla"></div>
        <div class="selection-panel"><h2 id="templateTitle"></h2><p id="templateHint"></p><div id="numberButtons" class="number-grid"></div></div>
      </section>

      <section id="sectorsScreen" class="screen hidden">
        <div class="intro"><p class="step-label">SECTORES TMA</p><h1 id="sectorTitle">Escoge tu sector</h1><p id="sectorHint"></p></div>
        <div id="chosenSectors" class="chosen-sectors"></div>
        <div id="sectorButtons" class="sector-grid"></div>
      </section>

      <section id="planScreen" class="screen hidden">
        <div class="plan-heading"><div><p class="step-label" id="planType"></p><h1>Planilla <span id="planNumber"></span></h1></div><button id="cancelButton" class="text-button">Cancelar</button></div>
        <div class="plan-instruction">Toca el horario para ver el esquema original</div>
        <div id="scheduleChart" class="schedule-chart" role="button" tabindex="0" aria-label="Ver esquema de la planilla"><span id="nowLine" class="now-line hidden"></span></div>
        <p id="planStatus" class="plan-status"></p>
      </section>
    </main>
  </div>

  <dialog id="imageDialog" class="image-dialog"><div class="image-bar"><strong>Esquema de la planilla</strong><button id="closeImage" class="icon-button" aria-label="Cerrar esquema">×</button></div><div class="image-frame"><img id="planImage" alt="Esquema original de la planilla"><span id="imageNowLine" class="image-now-line hidden"></span></div></dialog>

  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
